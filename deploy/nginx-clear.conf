# Блок для сайта БЛИК на sitesameday.com/clear.
#
# Вставить ВНУТРЬ существующего server { ... } основного сайта — того, что
# слушает 443 ssl для sitesameday.com, — рядом с имеющимся location / .
# Порядок блоков в файле не важен: nginx сам выбирает самый точный префикс,
# поэтому основной сайт продолжит отдаваться на всех остальных адресах.
#
# Модификатор ^~ обязателен: он не даёт регулярным location'ам основного сайта
# (например, location ~ \.php$) перехватить запросы к /clear.
#
# Заголовки кеширования и сжатие Next.js выставляет сам, поэтому здесь их нет.

location ^~ /clear {
    proxy_pass http://127.0.0.1:3100;
    proxy_http_version 1.1;

    # Пустой Connection включает keepalive до приложения.
    # Если понадобится запускать dev-режим за nginx, сюда нужно будет
    # вернуть проброс Upgrade, иначе не заработает горячая перезагрузка.
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
}
